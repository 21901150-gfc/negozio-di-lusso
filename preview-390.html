<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검수용 390px 미리보기</title>
<style>
  html, body { margin: 0; padding: 0; background: #08120D; }
  #f { display: block; width: 390px; height: 900px; border: 0; margin: 0 auto; background: #08120D; }
</style>
</head>
<body>
<iframe id="f" src="/negozio-di-lusso/" scrolling="no" title="검수용 미리보기"></iframe>
<script>
(function () {
  var y = parseInt((new URLSearchParams(location.search)).get('y') || '0', 10) || 0;
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      d.documentElement.scrollTop = y;
      if (d.body) { d.body.scrollTop = y; }
      document.title = 'ready y=' + y + ' inner=' + d.documentElement.scrollHeight;
    } catch (e) {
      document.title = 'err ' + e.message;
    }
  });
})();
</script>
</body>
</html>
